name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GnuCOBOL and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol libgmp-dev pkg-config make

      - name: Build
        run: make build

      - name: Upload artifact (binary)
        uses: actions/upload-artifact@v4
        with:
          name: cobol-data-app
          path: bin/cobol-data-app
